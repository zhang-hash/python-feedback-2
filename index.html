<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python函数学习反馈</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 教师专用区域 - 默认隐藏 */
        .teacher-section {
            display: none;
        }
        
        /* 学生界面 */
        .student-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .student-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .student-header h1 {
            font-size: 2rem;
            color: #1a2a6c;
            margin-bottom: 10px;
        }
        
        .student-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .form-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1a2a6c;
            font-size: 1.1rem;
        }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            border-color: #1a2a6c;
            outline: none;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background: linear-gradient(to right, #b21f1f, #fdbb2d);
            transform: translateY(-2px);
        }
        
        /* 词云区域 */
        .wordcloud-section {
            display: none;
            margin-top: 30px;
        }
        
        .wordcloud-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .wordcloud-title {
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .wordcloud-canvas {
            width: 100%;
            height: 250px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        
        /* 成功消息 */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #28a745;
            text-align: center;
        }
        
        /* 教师切换按钮 */
        .teacher-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .student-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 教师切换按钮 -->
    <button class="teacher-toggle" onclick="toggleTeacherView()">教师视图</button>

    <!-- 学生界面（默认显示） -->
    <div id="studentView">
        <div class="container">
            <div class="student-card">
                <div class="student-header">
                    <h1>Python函数学习反馈</h1>
                    <p>请回答以下三个问题，帮助我们改进教学</p>
                </div>

                <form id="feedbackForm" class="form-section">
                    <div class="form-group">
                        <label for="studentName">您的姓名（可选）:</label>
                        <input type="text" id="studentName" placeholder="输入您的姓名">
                    </div>
                    
                    <div class="form-group">
                        <label for="question1">1. 我们遇到了哪些函数？说出三个即可。</label>
                        <textarea id="question1" placeholder="例如：print(), len(), input()..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="question2">2. 他们的功能分别是什么？</label>
                        <textarea id="question2" placeholder="例如：print()用于输出信息，len()用于获取长度..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="question3">3. 函数功能是如何实现的？</label>
                        <textarea id="question3" placeholder="例如：通过函数名和参数调用，执行预定义的操作..." required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">提交反馈</button>
                </form>
            </div>

            <!-- 提交后显示词云 -->
            <div id="wordcloudSection" class="wordcloud-section">
                <div class="student-card">
                    <div class="student-header">
                        <h2>📊 全班反馈词云</h2>
                        <p>根据同学们的回答生成</p>
                    </div>
                    
                    <div class="wordcloud-container">
                        <div class="wordcloud-title">遇到的函数</div>
                        <canvas id="wordcloud1" class="wordcloud-canvas"></canvas>
                    </div>
                    
                    <div class="wordcloud-container">
                        <div class="wordcloud-title">函数功能</div>
                        <canvas id="wordcloud2" class="wordcloud-canvas"></canvas>
                    </div>
                    
                    <div class="wordcloud-container">
                        <div class="wordcloud-title">实现方式</div>
                        <canvas id="wordcloud3" class="wordcloud-canvas"></canvas>
                    </div>
                    
                    <button class="submit-btn" onclick="showFormAgain()" style="background: #6c757d; margin-top: 20px;">
                        再次提交反馈
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 教师界面（默认隐藏） -->
    <div id="teacherView" class="teacher-section">
        <div class="container">
            <div class="student-card">
                <div class="student-header">
                    <h1>Python函数学习反馈收集 - 教师视图</h1>
                    <p>扫描二维码分享给学生</p>
                </div>
                
                <div style="text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px; margin-bottom: 20px;">
                    <div id="qrcode" style="display: inline-block; margin: 15px 0;"></div>
                    <p>学生扫描此二维码参与反馈</p>
                    <div style="word-break: break-all; background: white; padding: 10px; border-radius: 5px; margin: 10px 0; border: 1px dashed #1a2a6c;">
                        <strong>访问链接：</strong><br>
                        <span id="pageUrl">https://zhang-hash.github.io/python-feedback-2/</span>
                    </div>
                    <button onclick="copyUrl()" style="padding: 10px 20px; background: #1a2a6c; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px;">
                        复制链接
                    </button>
                    <button onclick="addSampleData()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px;">
                        添加示例数据
                    </button>
                    <button onclick="clearAllData()" style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px;">
                        清空数据
                    </button>
                </div>
                
                <div id="teacherWordcloudSection">
                    <!-- 教师词云显示区域 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 视图切换
        function toggleTeacherView() {
            const studentView = document.getElementById('studentView');
            const teacherView = document.getElementById('teacherView');
            const toggleBtn = document.querySelector('.teacher-toggle');
            
            if (teacherView.style.display === 'block') {
                // 切换到学生视图
                studentView.style.display = 'block';
                teacherView.style.display = 'none';
                toggleBtn.textContent = '教师视图';
                toggleBtn.style.background = '#6c757d';
            } else {
                // 切换到教师视图
                studentView.style.display = 'none';
                teacherView.style.display = 'block';
                toggleBtn.textContent = '学生视图';
                toggleBtn.style.background = '#1a2a6c';
                generateQRCode();
                updateTeacherWordClouds();
            }
        }

        // 生成二维码（教师视图）
        function generateQRCode() {
            const currentUrl = window.location.href;
            document.getElementById('pageUrl').textContent = currentUrl;
            
            try {
                const typeNumber = 4;
                const errorCorrectionLevel = 'L';
                const qr = qrcode(typeNumber, errorCorrectionLevel);
                qr.addData(currentUrl);
                qr.make();
                
                const qrImage = qr.createImgTag(4, 0);
                document.getElementById('qrcode').innerHTML = qrImage;
            } catch (error) {
                document.getElementById('qrcode').innerHTML = `
                    <div style="text-align:center; padding:20px; color: #666;">
                        <div style="font-size: 48px; margin-bottom: 10px;">📱</div>
                        <strong>请访问：</strong><br>
                        <small>${currentUrl}</small>
                    </div>
                `;
            }
        }

        function copyUrl() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制到剪贴板！');
            });
        }

        // 学生表单提交
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('studentName').value || '匿名';
            const q1 = document.getElementById('question1').value;
            const q2 = document.getElementById('question2').value;
            const q3 = document.getElementById('question3').value;
            
            if (!q1 || !q2 || !q3) {
                alert('请填写所有问题！');
                return;
            }
            
            // 存储到本地
            let responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            responses.push({
                name: name,
                q1: q1,
                q2: q2,
                q3: q3,
                timestamp: new Date().toLocaleString()
            });
            localStorage.setItem('pythonFeedback', JSON.stringify(responses));
            
            // 显示成功消息和词云
            document.getElementById('feedbackForm').style.display = 'none';
            document.getElementById('wordcloudSection').style.display = 'block';
            
            // 更新词云
            updateStudentWordClouds();
        });

        // 显示表单再次提交
        function showFormAgain() {
            document.getElementById('feedbackForm').style.display = 'grid';
            document.getElementById('wordcloudSection').style.display = 'none';
            document.getElementById('feedbackForm').reset();
        }

        // 生成词云数据
        function generateWordCloudData(texts) {
            if (texts.length === 0) return [];
            
            const allText = texts.join(' ').toLowerCase();
            const words = allText.replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s]/g, '')
                                .split(/\s+/)
                                .filter(word => word.length > 1);
            
            const wordFreq = {};
            words.forEach(word => {
                wordFreq[word] = (wordFreq[word] || 0) + 1;
            });
            
            const wordList = [];
            for (const word in wordFreq) {
                wordList.push([word, wordFreq[word]]);
            }
            
            return wordList.sort((a, b) => b[1] - a[1]).slice(0, 30);
        }

        // 更新学生词云
        function updateStudentWordClouds() {
            const responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            
            if (responses.length === 0) return;
            
            const q1Texts = responses.map(r => r.q1);
            const q2Texts = responses.map(r => r.q2);
            const q3Texts = responses.map(r => r.q3);
            
            const wcData1 = generateWordCloudData(q1Texts);
            const wcData2 = generateWordCloudData(q2Texts);
            const wcData3 = generateWordCloudData(q3Texts);
            
            createWordCloud('wordcloud1', wcData1);
            createWordCloud('wordcloud2', wcData2);
            createWordCloud('wordcloud3', wcData3);
        }

        // 更新教师词云
        function updateTeacherWordClouds() {
            const responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            const teacherSection = document.getElementById('teacherWordcloudSection');
            
            if (responses.length === 0) {
                teacherSection.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <h3>暂无学生反馈数据</h3>
                        <p>可以点击"添加示例数据"查看词云效果</p>
                    </div>
                `;
                return;
            }
            
            teacherSection.innerHTML = `
                <div class="wordcloud-container">
                    <div class="wordcloud-title">遇到的函数</div>
                    <canvas id="teacherWordcloud1" class="wordcloud-canvas"></canvas>
                </div>
                <div class="wordcloud-container">
                    <div class="wordcloud-title">函数功能</div>
                    <canvas id="teacherWordcloud2" class="wordcloud-canvas"></canvas>
                </div>
                <div class="wordcloud-container">
                    <div class="wordcloud-title">实现方式</div>
                    <canvas id="teacherWordcloud3" class="wordcloud-canvas"></canvas>
                </div>
            `;
            
            const q1Texts = responses.map(r => r.q1);
            const q2Texts = responses.map(r => r.q2);
            const q3Texts = responses.map(r => r.q3);
            
            const wcData1 = generateWordCloudData(q1Texts);
            const wcData2 = generateWordCloudData(q2Texts);
            const wcData3 = generateWordCloudData(q3Texts);
            
            createWordCloud('teacherWordcloud1', wcData1);
            createWordCloud('teacherWordcloud2', wcData2);
            createWordCloud('teacherWordcloud3', wcData3);
        }

        // 创建词云
        function createWordCloud(canvasId, wordList) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (wordList.length > 0) {
                WordCloud(canvas, {
                    list: wordList,
                    gridSize: Math.round(16 * canvas.width / 1024),
                    weightFactor: function(size) {
                        return Math.pow(size, 1.5) * canvas.width / 1024;
                    },
                    fontFamily: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif',
                    color: function() {
                        const colors = ['#1a2a6c', '#b21f1f', '#fdbb2d', '#28a745', '#6f42c1', '#e83e8c'];
                        return colors[Math.floor(Math.random() * colors.length)];
                    },
                    rotateRatio: 0.5,
                    rotationSteps: 2,
                    backgroundColor: '#ffffff'
                });
            } else {
                ctx.fillStyle = '#666';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
            }
        }

        // 添加示例数据
        function addSampleData() {
            const sampleData = [
                {
                    name: "张三",
                    q1: "print(), len(), input()",
                    q2: "print()用于输出信息，len()用于获取长度，input()用于接收用户输入",
                    q3: "通过函数名和参数调用，执行预定义的操作",
                    timestamp: new Date().toLocaleString()
                },
                {
                    name: "李四",
                    q1: "range(), type(), str()",
                    q2: "range()生成数字序列，type()查看数据类型，str()转换为字符串",
                    q3: "函数接收输入参数，处理数据，返回结果",
                    timestamp: new Date().toLocaleString()
                }
            ];
            
            let responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            responses = responses.concat(sampleData);
            localStorage.setItem('pythonFeedback', JSON.stringify(responses));
            
            alert('已添加示例数据！');
            updateTeacherWordClouds();
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有数据吗？此操作不可撤销。')) {
                localStorage.removeItem('pythonFeedback');
                alert('所有数据已清空。');
                updateTeacherWordClouds();
            }
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            // 默认显示学生视图
            document.getElementById('studentView').style.display = 'block';
            document.getElementById('teacherView').style.display = 'none';
        });
    </script>
</body>
</html>
