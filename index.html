<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python函数学习反馈</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 教师专用区域 - 默认隐藏 */
        .teacher-section {
            display: none;
        }
        
        /* 学生界面 */
        .student-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .student-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .student-header h1 {
            font-size: 2rem;
            color: #1a2a6c;
            margin-bottom: 10px;
        }
        
        .student-header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .form-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1a2a6c;
            font-size: 1.1rem;
        }
        
        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            border-color: #1a2a6c;
            outline: none;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background: linear-gradient(to right, #b21f1f, #fdbb2d);
            transform: translateY(-2px);
        }
        
        /* 词云区域 */
        .wordcloud-section {
            display: none;
            margin-top: 30px;
        }
        
        .wordcloud-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .wordcloud-title {
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .wordcloud-canvas {
            width: 100%;
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
        }
        
        /* 统计信息 */
        .stats-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            color: #1a2a6c;
        }
        
        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #28a745, #20c997);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        /* 成功消息 */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #28a745;
            text-align: center;
        }
        
        /* 教师切换按钮 */
        .teacher-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 1000;
        }
        
        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a2a6c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .student-card {
                padding: 20px;
            }
            
            .wordcloud-canvas {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- 教师切换按钮 -->
    <button class="teacher-toggle" onclick="toggleTeacherView()">教师视图</button>

    <!-- 学生界面（默认显示） -->
    <div id="studentView">
        <div class="container">
            <div class="student-card">
                <div class="student-header">
                    <h1>Python函数学习反馈</h1>
                    <p>请回答以下三个问题，帮助我们改进教学</p>
                </div>

                <form id="feedbackForm" class="form-section">
                    <div class="form-group">
                        <label for="studentName">您的姓名（可选）:</label>
                        <input type="text" id="studentName" placeholder="输入您的姓名">
                    </div>
                    
                    <div class="form-group">
                        <label for="question1">1. 我们遇到了哪些函数？说出三个即可。</label>
                        <textarea id="question1" placeholder="例如：print(), len(), input()..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="question2">2. 他们的功能分别是什么？</label>
                        <textarea id="question2" placeholder="例如：print()用于输出信息，len()用于获取长度..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="question3">3. 函数功能是如何实现的？</label>
                        <textarea id="question3" placeholder="例如：通过函数名和参数调用，执行预定义的操作..." required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">提交反馈</button>
                </form>
            </div>

            <!-- 提交后显示词云 -->
            <div id="wordcloudSection" class="wordcloud-section">
                <div class="student-card">
                    <div class="student-header">
                        <h2>📊 全班反馈词云</h2>
                        <p>根据同学们的回答生成</p>
                    </div>
                    
                    <!-- 统计信息 -->
                    <div class="stats-info" id="studentStatsInfo">
                        已收集 <span id="studentResponseCount">0</span> 份反馈（共40人）
                    </div>
                    
                    <!-- 进度条 -->
                    <div class="progress-bar">
                        <div class="progress-fill" id="studentProgressBar" style="width: 0%"></div>
                    </div>
                    
                    <!-- 词云容器 -->
                    <div id="studentWordcloudContainer">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>正在生成词云...</p>
                        </div>
                    </div>
                    
                    <button class="submit-btn" onclick="showFormAgain()" style="background: #6c757d; margin-top: 20px;">
                        再次提交反馈
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 教师界面（默认隐藏） -->
    <div id="teacherView" class="teacher-section">
        <div class="container">
            <div class="student-card">
                <div class="student-header">
                    <h1>Python函数学习反馈收集 - 教师视图</h1>
                    <p>扫描二维码分享给学生</p>
                </div>
                
                <div style="text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px; margin-bottom: 20px;">
                    <div id="qrcode" style="display: inline-block; margin: 15px 0;"></div>
                    <p>学生扫描此二维码参与反馈</p>
                    <div style="word-break: break-all; background: white; padding: 10px; border-radius: 5px; margin: 10px 0; border: 1px dashed #1a2a6c;">
                        <strong>访问链接：</strong><br>
                        <span id="pageUrl">https://zhang-hash.github.io/python-feedback-2/</span>
                    </div>
                    <button onclick="copyUrl()" style="padding: 10px 20px; background: #1a2a6c; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px;">
                        复制链接
                    </button>
                    <button onclick="addSampleData()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px;">
                        添加示例数据
                    </button>
                    <button onclick="clearAllData()" style="padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px;">
                        清空数据
                    </button>
                </div>
                
                <!-- 教师统计信息 -->
                <div class="stats-info" id="teacherStatsInfo">
                    已收集 <span id="teacherResponseCount">0</span> 份反馈（共40人）
                </div>
                
                <!-- 教师进度条 -->
                <div class="progress-bar">
                    <div class="progress-fill" id="teacherProgressBar" style="width: 0%"></div>
                </div>
                
                <div id="teacherWordcloudSection">
                    <!-- 教师词云显示区域 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 班级总人数
        const TOTAL_STUDENTS = 40;

        // 视图切换
        function toggleTeacherView() {
            const studentView = document.getElementById('studentView');
            const teacherView = document.getElementById('teacherView');
            const toggleBtn = document.querySelector('.teacher-toggle');
            
            if (teacherView.style.display === 'block') {
                // 切换到学生视图
                studentView.style.display = 'block';
                teacherView.style.display = 'none';
                toggleBtn.textContent = '教师视图';
                toggleBtn.style.background = '#6c757d';
            } else {
                // 切换到教师视图
                studentView.style.display = 'none';
                teacherView.style.display = 'block';
                toggleBtn.textContent = '学生视图';
                toggleBtn.style.background = '#1a2a6c';
                generateQRCode();
                updateTeacherWordClouds();
            }
        }

        // 生成二维码（教师视图）
        function generateQRCode() {
            const currentUrl = window.location.href;
            document.getElementById('pageUrl').textContent = currentUrl;
            
            try {
                const typeNumber = 4;
                const errorCorrectionLevel = 'L';
                const qr = qrcode(typeNumber, errorCorrectionLevel);
                qr.addData(currentUrl);
                qr.make();
                
                const qrImage = qr.createImgTag(4, 0);
                document.getElementById('qrcode').innerHTML = qrImage;
            } catch (error) {
                document.getElementById('qrcode').innerHTML = `
                    <div style="text-align:center; padding:20px; color: #666;">
                        <div style="font-size: 48px; margin-bottom: 10px;">📱</div>
                        <strong>请访问：</strong><br>
                        <small>${currentUrl}</small>
                    </div>
                `;
            }
        }

        function copyUrl() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制到剪贴板！');
            });
        }

        // 更新统计信息
        function updateStats() {
            const responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            const count = responses.length;
            const progressPercent = Math.min(100, (count / TOTAL_STUDENTS) * 100);
            
            // 安全地更新学生统计
            const studentCountElement = document.getElementById('studentResponseCount');
            if (studentCountElement) {
                studentCountElement.textContent = count;
            }
            
            // 安全地更新教师统计
            const teacherCountElement = document.getElementById('teacherResponseCount');
            if (teacherCountElement) {
                teacherCountElement.textContent = count;
            }
            
            // 更新进度条
            const studentProgressBar = document.getElementById('studentProgressBar');
            const teacherProgressBar = document.getElementById('teacherProgressBar');
            if (studentProgressBar) studentProgressBar.style.width = progressPercent + '%';
            if (teacherProgressBar) teacherProgressBar.style.width = progressPercent + '%';
            
            // 更新进度显示
            const studentStatsElement = document.getElementById('studentStatsInfo');
            const teacherStatsElement = document.getElementById('teacherStatsInfo');
            
            if (studentStatsElement) {
                studentStatsElement.innerHTML = 
                    `已收集 <span style="color: #b21f1f; font-size: 1.2em;">${count}</span> 份反馈（共${TOTAL_STUDENTS}人） - ${progressPercent.toFixed(0)}%`;
            }
            
            if (teacherStatsElement) {
                teacherStatsElement.innerHTML = 
                    `已收集 <span style="color: #b21f1f; font-size: 1.2em;">${count}</span> 份反馈（共${TOTAL_STUDENTS}人） - ${progressPercent.toFixed(0)}%`;
            }
        }

        // 学生表单提交
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('studentName').value || '匿名';
            const q1 = document.getElementById('question1').value;
            const q2 = document.getElementById('question2').value;
            const q3 = document.getElementById('question3').value;
            
            if (!q1 || !q2 || !q3) {
                alert('请填写所有问题！');
                return;
            }
            
            // 存储到本地
            let responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            responses.push({
                name: name,
                q1: q1,
                q2: q2,
                q3: q3,
                timestamp: new Date().toLocaleString()
            });
            localStorage.setItem('pythonFeedback', JSON.stringify(responses));
            
            // 显示成功消息和词云
            document.getElementById('feedbackForm').style.display = 'none';
            document.getElementById('wordcloudSection').style.display = 'block';
            
            // 更新统计和词云
            updateStats();
            updateStudentWordClouds();
        });

        // 显示表单再次提交
        function showFormAgain() {
            document.getElementById('feedbackForm').style.display = 'grid';
            document.getElementById('wordcloudSection').style.display = 'none';
            document.getElementById('feedbackForm').reset();
        }

        // 生成词云数据
        function generateWordCloudData(texts) {
            if (texts.length === 0) return [];
            
            const allText = texts.join(' ').toLowerCase();
            
            // 更好的文本清理
            const words = allText.replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s()_,.]/g, ' ')
                                .split(/\s+/)
                                .filter(word => {
                                    return word.length > 2 || 
                                           (word.includes('(') && word.includes(')')) ||
                                           (word.length === 3 && word.includes('()'));
                                })
                                .map(word => word.replace(/[(),]/g, '').trim())
                                .filter(word => word.length > 1);
            
            const wordFreq = {};
            words.forEach(word => {
                wordFreq[word] = (wordFreq[word] || 0) + 1;
            });
            
            const wordList = [];
            for (const word in wordFreq) {
                let weight = wordFreq[word];
                // 为40人班级优化权重
                if (weight > 8) weight = Math.sqrt(weight) * 2.5;
                wordList.push([word, weight]);
            }
            
            // 取前15个词
            return wordList.sort((a, b) => b[1] - a[1]).slice(0, 15);
        }

        // 更新学生词云
        function updateStudentWordClouds() {
            const responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            const container = document.getElementById('studentWordcloudContainer');
            
            if (responses.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <h3>暂无反馈数据</h3>
                        <p>您是第一份提交，等待其他同学提交后即可看到词云</p>
                    </div>
                `;
                return;
            }
            
            // 先显示加载状态
            container.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在生成词云...</p>
                </div>
            `;
            
            // 延迟执行，确保DOM更新
            setTimeout(() => {
                const q1Texts = responses.map(r => r.q1);
                const q2Texts = responses.map(r => r.q2);
                const q3Texts = responses.map(r => r.q3);
                
                const wcData1 = generateWordCloudData(q1Texts);
                const wcData2 = generateWordCloudData(q2Texts);
                const wcData3 = generateWordCloudData(q3Texts);
                
                // 重新创建词云容器
                container.innerHTML = `
                    <div class="wordcloud-container">
                        <div class="wordcloud-title">遇到的函数</div>
                        <canvas id="studentWordcloud1" class="wordcloud-canvas" width="350" height="300"></canvas>
                    </div>
                    <div class="wordcloud-container">
                        <div class="wordcloud-title">函数功能</div>
                        <canvas id="studentWordcloud2" class="wordcloud-canvas" width="350" height="300"></canvas>
                    </div>
                    <div class="wordcloud-container">
                        <div class="wordcloud-title">实现方式</div>
                        <canvas id="studentWordcloud3" class="wordcloud-canvas" width="350" height="300"></canvas>
                    </div>
                `;
                
                // 创建词云
                createWordCloud('studentWordcloud1', wcData1);
                createWordCloud('studentWordcloud2', wcData2);
                createWordCloud('studentWordcloud3', wcData3);
            }, 100);
        }

        // 更新教师词云
        function updateTeacherWordClouds() {
            const responses = JSON.parse(localStorage.getItem('pythonFeedback')) || [];
            const teacherSection = document.getElementById('teacherWordcloudSection');
            
            updateStats();
            
            if (responses.length === 0) {
                teacherSection.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <h3>暂无学生反馈数据</h3>
                        <p>可以点击"添加示例数据"查看词云效果</p>
                    </div>
                `;
                return;
            }
            
            teacherSection.innerHTML = `
                <div class="wordcloud-container">
                    <div class="wordcloud-title">遇到的函数</div>
                    <canvas id="teacherWordcloud1" class="wordcloud-canvas" width="350" height="300"></canvas>
                </div>
                <div class="wordcloud-container">
                    <div class="wordcloud-title">函数功能</div>
                    <canvas id="teacherWordcloud2" class="wordcloud-canvas" width="350" height="300"></canvas>
                </div>
                <div class="wordcloud-container">
                    <div class="wordcloud-title">实现方式</div>
                    <canvas id="teacherWordcloud3" class="wordcloud-canvas" width="350" height="300"></canvas>
                </div>
            `;
            
            const q1Texts = responses.map(r => r.q1);
            const q2Texts = responses.map(r => r.q2);
            const q3Texts = responses.map(r => r.q3);
            
            const wcData1 = generateWordCloudData(q1Texts);
            const wcData2 = generateWordCloudData(q2Texts);
            const wcData3 = generateWordCloudData(q3Texts);
            
            createWordCloud('teacherWordcloud1', wcData1);
            createWordCloud('teacherWordcloud2', wcData2);
            createWordCloud('teacherWordcloud3', wcData3);
        }

        // 创建词云
        function createWordCloud(canvasId, wordList) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) {
                return;
            }
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (wordList && wordList.length > 0) {
                try {
                    WordCloud(canvas, {
                        list: wordList,
                        gridSize: 10,
                        weightFactor: function(size) {
                            return Math.pow(size, 1.2) * 15;
                        },
                        fontFamily: 'Arial, sans-serif',
                        color: function() {
                            const colors = ['#1a2a6c', '#b21f1f', '#fdbb2d', '#28a745', '#6f42c1'];
                            return colors[Math.floor(Math.random() * colors.length)];
                        },
                        rotateRatio: 0.2,
                        rotationSteps: 1,
                        backgroundColor: '#ffffff',
                        minSize: 8,
                        drawOutOfBound: false,
                        shrinkToFit: true
                    });
                } catch (error) {
                    ctx.fillStyle = '#666';
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('生成失败', canvas.width / 2, canvas.height / 2);
                }
            } else {
                ctx.fillStyle = '#666';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
            }
        }

        // 添加示例数据（40人班级）
        function addSampleData() {
            const sampleFunctions = [
                "print()", "len()", "input()", "range()", "type()", "str()", 
                "int()", "float()", "list()", "dict()", "set()", "tuple()",
                "max()", "min()", "sum()", "sorted()", "abs()", "round()",
                "open()", "format()", "zip()", "enumerate()"
            ];
            
            const sampleFunctionsChinese = [
                "打印", "长度", "输入", "范围", "类型", "字符串",
                "整数", "浮点数", "列表", "字典", "集合", "元组",
                "最大值", "最小值", "求和", "排序", "绝对值", "四舍五入",
                "打开文件", "格式化", "压缩", "枚举"
            ];
            
            const sampleData = [];
            
            // 生成40个样本数据
            for (let i = 1; i <= 40; i++) {
                // 随机选择3个函数
                const selectedFuncs = [];
                const selectedChinese = [];
                const usedIndices = new Set();
                
                for (let j = 0; j < 3; j++) {
                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * sampleFunctions.length);
                    } while (usedIndices.has(randomIndex));
                    
                    usedIndices.add(randomIndex);
                    selectedFuncs.push(sampleFunctions[randomIndex]);
                    selectedChinese.push(sampleFunctionsChinese[randomIndex]);
                }
                
                sampleData.push({
                    name: `学生${i}`,
                    q1: selectedFuncs.join(', '),
                    q2: `${selectedFuncs[0]}用于${selectedChinese[0]}, ${selectedFuncs[1]}用于${selectedChinese[1]}, ${selectedFuncs[2]}用于${selectedChinese[2]}`,
                    q3: "通过函数名和参数调用，执行预定义的操作，返回结果",
                    timestamp: new Date().toLocaleString()
                });
            }
            
            localStorage.setItem('pythonFeedback', JSON.stringify(sampleData));
            
            alert('已添加40个示例数据！现在可以看到完整的词云效果。');
            updateStats();
            if (document.getElementById('teacherView').style.display === 'block') {
                updateTeacherWordClouds();
            }
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有数据吗？此操作不可撤销。')) {
                localStorage.removeItem('pythonFeedback');
                alert('所有数据已清空。');
                updateStats();
                updateTeacherWordClouds();
            }
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            // 默认显示学生视图
            document.getElementById('studentView').style.display = 'block';
            document.getElementById('teacherView').style.display = 'none';
            updateStats();
            
            // 初始化学生词云容器
            document.getElementById('studentWordcloudContainer').innerHTML = `
                <div class="wordcloud-container">
                    <div class="wordcloud-title">遇到的函数</div>
                    <canvas id="studentWordcloud1" class="wordcloud-canvas" width="350" height="300"></canvas>
                </div>
                <div class="wordcloud-container">
                    <div class="wordcloud-title">函数功能</div>
                    <canvas id="studentWordcloud2" class="wordcloud-canvas" width="350" height="300"></canvas>
                </div>
                <div class="wordcloud-container">
                    <div class="wordcloud-title">实现方式</div>
                    <canvas id="studentWordcloud3" class="wordcloud-canvas" width="350" height="300"></canvas>
                </div>
            `;
        });
    </script>
</body>
</html>
