<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python函数学习反馈收集</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); padding: 20px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .qrcode-section { text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px; margin-bottom: 20px; }
        #qrcode { width: 200px; height: 200px; display: inline-block; margin: 15px 0; }
        .share-link { background: #e9ecef; padding: 10px; border-radius: 5px; margin: 10px 0; word-break: break-all; }
        button { padding: 10px 20px; background: #1a2a6c; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #1a2a6c; }
        input, textarea { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; }
        textarea { min-height: 80px; resize: vertical; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Python函数学习反馈收集</h1>
            <p>扫描二维码参与反馈</p>
        </header>
        
        <div class="card">
            <div class="qrcode-section">
                <h2>📱 手机扫描二维码参与</h2>
                <div id="qrcode"></div>
                <p>使用手机扫描二维码参与反馈</p>
                <div class="share-link">
                    <strong>访问链接：</strong><br>
                    <span id="pageUrl">加载中...</span>
                </div>
                <button onclick="copyUrl()">复制链接</button>
            </div>

            <div>
                <h2>反馈问题</h2>
                <form id="feedbackForm">
                    <div class="form-group">
                        <label>您的姓名（可选）:</label>
                        <input type="text" id="studentName" placeholder="输入您的姓名">
                    </div>
                    <div class="form-group">
                        <label>问题一：在前面的学习中，我们遇到了哪些函数？说出三个即可。</label>
                        <textarea id="question1" placeholder="例如：print(), len(), input()..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>问题二：他们的功能分别是什么？</label>
                        <textarea id="question2" placeholder="例如：print()用于输出信息，len()用于获取长度..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>问题三：函数功能是如何实现的？</label>
                        <textarea id="question3" placeholder="例如：通过函数名和参数调用，执行预定义的操作..." required></textarea>
                    </div>
                    <button type="submit">提交反馈</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 生成二维码
        function generateQRCode() {
            const currentUrl = window.location.href;
            document.getElementById('pageUrl').textContent = currentUrl;
            
            try {
                // 清空并重新生成二维码
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), {
                    text: currentUrl,
                    width: 200,
                    height: 200,
                    colorDark: "#1a2a6c",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                console.log('二维码生成成功！');
            } catch (error) {
                console.error('二维码生成失败:', error);
                document.getElementById('qrcode').innerHTML = `
                    <div style="text-align:center; padding:20px; color: #666;">
                        <div style="font-size: 48px;">📱</div>
                        <strong>请访问：</strong><br>
                        <small>${currentUrl}</small>
                    </div>
                `;
            }
        }

        // 复制链接
        function copyUrl() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('链接已复制到剪贴板！');
            });
        }

        // 表单提交
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('感谢您的反馈！回答已提交。');
            this.reset();
        });

        // 页面加载时生成二维码
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始生成二维码...');
            generateQRCode();
        });
    </script>
</body>
</html>
